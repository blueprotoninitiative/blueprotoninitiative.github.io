<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Blue Proton Initiative</title>
<meta name="description" content="The page you are looking for does not exist on the Blue Proton Initiative website.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a6fd4">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root { --blue: #1a6fd4; --text: #0a0a0a; --muted: #6b7280; --border: #e5e7eb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--text);
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  .logo { width: 64px; height: 64px; margin-bottom: 32px; }
  .code { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--blue); font-weight: 600; margin-bottom: 20px; }
  h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 700; letter-spacing: -2px; line-height: 1; margin-bottom: 20px; }
  p { font-size: 17px; color: var(--muted); font-weight: 300; line-height: 1.6; max-width: 420px; margin-bottom: 36px; }
  a {
    background: var(--text);
    color: white;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  a:hover { opacity: 0.85; }
  a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 80 80" fill="none" aria-hidden="true">
    <ellipse cx="40" cy="40" rx="36" ry="14" stroke="#1a6fd4" stroke-width="2"/>
    <ellipse cx="40" cy="40" rx="36" ry="14" stroke="#1a6fd4" stroke-width="2" transform="rotate(60 40 40)"/>
    <ellipse cx="40" cy="40" rx="36" ry="14" stroke="#1a6fd4" stroke-width="2" transform="rotate(120 40 40)"/>
    <circle cx="40" cy="40" r="6" fill="#1a6fd4"/>
  </svg>
  <p class="code">Error 404</p>
  <h1>Page not found.</h1>
  <p>The page you are looking for does not exist or has been moved.</p>
  <a href="/">Back to home</a>
</main>
</body>
</html>
